<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin — Barbearia Inho Dú Corte</title>
    <style>
        :root {
            --bg-color: #0b0b0b;
            --card-bg: #161616;
            --gold: #d4af37;
            --text-white: #ffffff;
            --text-gray: #a0a0a0;
            --accent-red: #e74c3c;
            --accent-green: #2ecc71;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-white); padding: 20px 10px 50px 10px; }
        header { text-align: center; margin-bottom: 20px; border-bottom: 2px solid var(--gold); padding-bottom: 15px; }
        h1 { color: var(--gold); font-size: 1.6rem; text-transform: uppercase; }
        .container { max-width: 600px; margin: 0 auto; }
        .card { background-color: var(--card-bg); border: 1px solid #333; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .btn { display: inline-block; width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-top: 8px; text-align: center; font-size: 0.95rem; }
        .btn-green { background: var(--accent-green); color: #000; }
        .btn-red { background: var(--accent-red); color: #fff; }
        .btn-gold { background: var(--gold); color: #000; }
        .btn-outline { background: transparent; border: 1px solid var(--gold); color: var(--gold); }
        .cliente-item { background: #222; border-left: 4px solid var(--gold); padding: 15px; margin-bottom: 10px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
        .cliente-info h3 { font-size: 1.1rem; color: #fff; }
        .cliente-info p { font-size: 0.85rem; color: var(--text-gray); margin-top: 4px; }
        .actions { display: flex; gap: 5px; }
        .actions button { padding: 8px 12px; font-size: 0.8rem; border-radius: 5px; border: none; cursor: pointer; font-weight: bold; }
        #login-modal { text-align: center; }
        input[type="password"] { width: 100%; padding: 12px; background: #000; border: 1px solid #444; color: #fff; border-radius: 6px; margin: 15px 0; font-size: 1rem; text-align: center; }
    </style>
</head>
<body>

    <div class="container">
        <!-- TELA DE LOGIN DO INHO -->
        <div class="card" id="login-modal">
            <h1 style="margin-bottom: 10px;">Painel do Inho 💈</h1>
            <p style="color: var(--text-gray); font-size: 0.9rem;">Digite a senha para acessar a gestão da fila:</p>
            <input type="password" id="senha-admin" placeholder="Digite sua senha">
            <button class="btn btn-gold" onclick="autenticar()">Entrar no Painel</button>
        </div>

        <!-- CONTEÚDO PRINCIPAL (OCULTO ATÉ LOGAR) -->
        <div id="painel-conteudo" style="display: none;">
            <header>
                <h1>Gestão da Fila</h1>
                <p style="color: var(--text-gray); font-size: 0.85rem; margin-top: 5px;">Barbearia Inho Dú Corte</p>
            </header>

            <!-- Controle da Fila -->
            <div class="card">
                <h2 style="color: var(--gold); font-size: 1.1rem; margin-bottom: 10px;">Controle Geral</h2>
                <div style="display: flex; gap: 10px;">
                    <button class="btn btn-green" onclick="alert('Fila Aberta!')">Abrir Fila</button>
                    <button class="btn btn-red" onclick="alert('Fila Pausada!')">Pausar Fila</button>
                </div>
                <button class="btn btn-outline" style="margin-top: 10px;" onclick="limparFila()">Esvaziar / Limpar Fila do Dia</button>
            </div>

            <!-- Lista de Clientes na Fila -->
            <div class="card">
                <h2 style="color: var(--gold); font-size: 1.1rem; margin-bottom: 15px;">Clientes Aguardando (<span id="total-clientes">0</span>)</h2>
                <div id="lista-fila">
                    <p style="text-align: center; color: var(--text-gray);">Nenhum cliente na fila no momento.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SENHA_CORRETA = "inho123"; // Senha padrão (você pode alterar aqui)

        function autenticar() {
            const senha = document.getElementById('senha-admin').value;
            if (senha === SENHA_CORRETA) {
                document.getElementById('login-modal').style.display = 'none';
                document.getElementById('painel-conteudo').style.display = 'block';
                carregarFilaAdmin();
            } else {
                alert('Senha incorreta, meu mano!');
            }
        }

        function carregarFilaAdmin() {
            let fila = JSON.parse(localStorage.getItem('fila_inho') || '[]');
            const container = document.getElementById('lista-fila');
            document.getElementById('total-clientes').innerText = fila.length;

            if (fila.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: var(--text-gray);">Nenhum cliente na fila no momento.</p>';
                return;
            }

            container.innerHTML = '';
            fila.forEach((cli, idx) => {
                container.innerHTML += `
                    <div class="cliente-item">
                        <div class="cliente-info">
                            <h3>#${idx + 1} - ${cli.nome}</h3>
                            <p><b>Serviço:</b> ${cli.servico}</p>
                            <p><b>Zap:</b> ${cli.whatsapp}</p>
                        </div>
                        <div class="actions">
                            <button class="btn-green" onclick="atenderCliente(${idx})">Atender</button>
                            <button class="btn-red" onclick="removerCliente(${idx})">Sair</button>
                        </div>
                    </div>
                `;
            });
        }

        function atenderCliente(index) {
            let fila = JSON.parse(localStorage.getItem('fila_inho') || '[]');
            const cliente = fila[index];
            if (confirm(`Concluir atendimento de ${cliente.nome}?`)) {
                fila.splice(index, 1);
                localStorage.setItem('fila_inho', JSON.stringify(fila));
                carregarFilaAdmin();
            }
        }

        function removerCliente(index) {
            let fila = JSON.parse(localStorage.getItem('fila_inho') || '[]');
            if (confirm(`Remover cliente da fila?`)) {
                fila.splice(index, 1);
                localStorage.setItem('fila_inho', JSON.stringify(fila));
                carregarFilaAdmin();
            }
        }

        function limparFila() {
            if (confirm('Tem certeza que quer apagar todos os clientes da fila hoje?')) {
                localStorage.removeItem('fila_inho');
                carregarFilaAdmin();
            }
        }
    </script>
</body>
</html>
